services:
  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Kolkata
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./secrets:/run/secrets:ro
      - ./state:/state
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time;from pathlib import Path;p=Path('/state/scheduler.json');assert p.exists() and time.time()-json.loads(p.read_text()).get('last_checked_at',0)<180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
