name: Set up reviewed media validation
description: Install pinned image validation and verify video decoder availability
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r media-host/requirements.txt
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          # Use Ubuntu's signed upstream archives instead of the hosted runner's
          # Azure mirror, whose slow downloads can exhaust checkpoint timeouts.
          apt_options=(-o "Dir::Etc::sourcelist=$GITHUB_WORKSPACE/.github/actions/setup-media-validator/ubuntu.sources"
                       -o 'Dir::Etc::sourceparts=-'
                       -o 'Acquire::Retries=2'
                       -o 'Acquire::https::Timeout=20')
          sudo apt-get "${apt_options[@]}" update -qq
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
        fi
        python -c 'from PIL import Image; print("Image validator available")'
        ffmpeg -version >/dev/null
        ffprobe -version >/dev/null
