name: Set up reviewed media validation
description: Install the pinned image decoder and ensure real video decoders exist
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install --requirement media-host/requirements.txt
        if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi
        ffmpeg -version >/dev/null
        ffprobe -version >/dev/null
