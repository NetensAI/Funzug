name: Publish approved Funzug posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: funzug-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUNZUG_FACEBOOK_PAGE_ID: ${{ secrets.FUNZUG_FACEBOOK_PAGE_ID }}
      FUNZUG_FACEBOOK_PAGE_TOKEN: ${{ secrets.FUNZUG_FACEBOOK_PAGE_TOKEN }}
      FUNZUG_INSTAGRAM_USER_ID: ${{ secrets.FUNZUG_INSTAGRAM_USER_ID }}
      FUNZUG_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.FUNZUG_INSTAGRAM_ACCESS_TOKEN }}
      FUNZUG_META_GRAPH_VERSION: ${{ vars.FUNZUG_META_GRAPH_VERSION }}
    steps:
      - name: Check out the approved queue
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate queue
        run: python funzug_pipeline.py validate

      - name: Publish due, approved posts
        run: python funzug_pipeline.py publish-due --execute --confirm-publish FUNZUG

      - name: Save publishing results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- queue.json; then
            git add queue.json
            git commit -m "Record Funzug publishing results"
            git push
          fi
