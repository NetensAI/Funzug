name: Publish approved Funzug posts

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      retry_failed_facebook_item_id:
        description: Approved failed Facebook item to publish immediately
        required: false
        type: string

concurrency:
  group: funzug-queue-writes
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Check out the approved queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate queue
        run: python funzug_pipeline.py validate

      - name: Check whether an approved post is due
        id: due
        env:
          RETRY_ITEM_ID: ${{ inputs.retry_failed_facebook_item_id }}
        run: |
          if [ -n "$RETRY_ITEM_ID" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=$(python funzug_pipeline.py check-due)" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: preflight
    if: needs.preflight.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: funzug-publish
    permissions:
      contents: write
    steps:
      - name: Check out the approved queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Publish due, approved posts
        env:
          FUNZUG_META_APP_SECRET: ${{ secrets.FUNZUG_META_APP_SECRET }}
          FUNZUG_FACEBOOK_PAGE_ID: ${{ secrets.FUNZUG_FACEBOOK_PAGE_ID }}
          FUNZUG_FACEBOOK_PAGE_TOKEN: ${{ secrets.FUNZUG_FACEBOOK_PAGE_TOKEN }}
          FUNZUG_INSTAGRAM_USER_ID: ${{ secrets.FUNZUG_INSTAGRAM_USER_ID }}
          FUNZUG_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.FUNZUG_INSTAGRAM_ACCESS_TOKEN }}
          FUNZUG_META_GRAPH_VERSION: ${{ vars.FUNZUG_META_GRAPH_VERSION }}
          FUNZUG_INSTAGRAM_API_MODE: ${{ vars.FUNZUG_INSTAGRAM_API_MODE }}
          RETRY_ITEM_ID: ${{ inputs.retry_failed_facebook_item_id }}
        run: |
          python scripts/meta_token_diagnostic.py
          if [ -n "$RETRY_ITEM_ID" ]; then
            python funzug_pipeline.py retry-failed-facebook --id "$RETRY_ITEM_ID"
          else
            python funzug_pipeline.py publish-due --execute --confirm-publish FUNZUG
          fi

      - name: Save publishing results and audit log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json history.json
          if [ -f logs/events.jsonl ]; then
            git add logs/events.jsonl
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Funzug publishing results"
            git push
          fi
