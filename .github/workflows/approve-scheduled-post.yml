name: Approve Funzug post for scheduled publication

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: Draft ID shown in the Funzug draft inbox
        required: true
        type: string
      review_note:
        description: Brief note confirming what you reviewed
        required: true
        type: string
      authorize_publication:
        description: Upload the reviewed image publicly and authorize publication at its scheduled time
        required: true
        type: choice
        options:
          - No, keep it as a draft
          - Yes, upload publicly and publish at scheduled time
      claims:
        description: I verified every factual claim
        required: true
        type: boolean
        default: false
      sources:
        description: I inspected the cited sources and they support the claims
        required: true
        type: boolean
        default: false
      caption:
        description: I reviewed the public caption
        required: true
        type: boolean
        default: false
      images:
        description: I inspected every image and confirmed it is ready for public use
        required: true
        type: boolean
        default: false
      platforms:
        description: I confirmed the Facebook and Instagram destinations
        required: true
        type: boolean
        default: false
      schedule:
        description: I confirmed the scheduled date and time
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: funzug-queue-writes
  cancel-in-progress: false

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    steps:
      - name: Require GitHub execution ownership before any operation
        env:
          FUNZUG_EXECUTION_OWNER: ${{ vars.FUNZUG_EXECUTION_OWNER }}
        run: test "$FUNZUG_EXECUTION_OWNER" = github
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up reviewed media validation
        uses: ./.github/actions/setup-media-validator
      - name: Validate the draft inbox and publishing queue
        run: |
          python funzug_pipeline.py validate-drafts
          python funzug_pipeline.py validate

      - name: Require explicit publication authorization and full review
        env:
          AUTHORIZE_PUBLICATION: ${{ inputs.authorize_publication }}
          REVIEW_CLAIMS: ${{ inputs.claims }}
          REVIEW_SOURCES: ${{ inputs.sources }}
          REVIEW_CAPTION: ${{ inputs.caption }}
          REVIEW_IMAGES: ${{ inputs.images }}
          REVIEW_PLATFORMS: ${{ inputs.platforms }}
          REVIEW_SCHEDULE: ${{ inputs.schedule }}
        run: |
          if [[ "$AUTHORIZE_PUBLICATION" != "Yes, upload publicly and publish at scheduled time" ]]; then
            echo "Public upload and publication authorization were not granted; no upload or approval was made."
            exit 1
          fi
          for check in "$REVIEW_CLAIMS" "$REVIEW_SOURCES" "$REVIEW_CAPTION" "$REVIEW_IMAGES" "$REVIEW_PLATFORMS" "$REVIEW_SCHEDULE"; do
            if [[ "$check" != "true" ]]; then
              echo "Every review checkbox must be selected; no approval was recorded."
              exit 1
            fi
          done

      - name: Upload approved media and record named human approval
        env:
          ITEM_ID: ${{ inputs.item_id }}
          REVIEW_NOTE: ${{ inputs.review_note }}
          AUTHORIZE_PUBLICATION: ${{ inputs.authorize_publication }}
          FUNZUG_MEDIA_BASE_URL: ${{ vars.FUNZUG_MEDIA_BASE_URL }}
          FUNZUG_MEDIA_UPLOAD_TOKEN: ${{ secrets.FUNZUG_MEDIA_UPLOAD_TOKEN }}
        run: |
          python funzug_pipeline.py host-and-approve-draft \
            --id "$ITEM_ID" \
            --approved-by "$GITHUB_ACTOR" \
            --note "$REVIEW_NOTE" \
            --media-origin "$FUNZUG_MEDIA_BASE_URL" \
            --confirm-public-upload FUNZUG \
            --authorize-publication "$AUTHORIZE_PUBLICATION" \
            --review-claims \
            --review-sources \
            --review-caption \
            --review-images \
            --review-platforms \
            --review-schedule
          python funzug_pipeline.py validate

      - name: Save approval and upload audit log
        if: always() && vars.FUNZUG_EXECUTION_OWNER == 'github'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if [ -f logs/events.jsonl ]; then
            git add logs/events.jsonl
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Funzug post approval and media upload"
            git push
          fi
