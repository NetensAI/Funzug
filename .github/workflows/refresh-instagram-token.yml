name: Refresh Instagram publishing token

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: funzug-instagram-token-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-token:
    if: vars.FUNZUG_INSTAGRAM_API_MODE == 'instagram_login'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned credential-management dependencies
        run: python -m pip install "PyJWT[crypto]==2.10.1" "PyNaCl==1.5.0"

      - name: Refresh and securely replace the Instagram environment secret
        env:
          FUNZUG_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.FUNZUG_INSTAGRAM_ACCESS_TOKEN }}
          FUNZUG_INSTAGRAM_USER_ID: ${{ secrets.FUNZUG_INSTAGRAM_USER_ID }}
          FUNZUG_META_APP_SECRET: ${{ secrets.FUNZUG_META_APP_SECRET }}
          FUNZUG_META_GRAPH_VERSION: ${{ vars.FUNZUG_META_GRAPH_VERSION }}
          FUNZUG_INSTAGRAM_API_MODE: ${{ vars.FUNZUG_INSTAGRAM_API_MODE }}
          FUNZUG_GH_APP_ID: ${{ secrets.FUNZUG_GH_APP_ID }}
          FUNZUG_GH_APP_PRIVATE_KEY: ${{ secrets.FUNZUG_GH_APP_PRIVATE_KEY }}
        run: python scripts/refresh_instagram_token.py
