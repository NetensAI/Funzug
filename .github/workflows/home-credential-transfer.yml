name: One-time encrypted home credential transfer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funzug-one-time-home-migration
  cancel-in-progress: false
jobs:
  encrypted-transfer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install authenticated encryption dependency
        run: python -m pip install 'cryptography==46.0.3'
      - name: Encrypt to existing Mini PC key
        env:
          FUNZUG_GH_APP_PRIVATE_KEY: ${{ secrets.FUNZUG_GH_APP_PRIVATE_KEY }}
          FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL: ${{ secrets.FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL }}
          FUNZUG_FACEBOOK_PAGE_TOKEN: ${{ secrets.FUNZUG_FACEBOOK_PAGE_TOKEN }}
          FUNZUG_META_APP_SECRET: ${{ secrets.FUNZUG_META_APP_SECRET }}
        run: python -m scripts.home_credential_transfer
      - uses: actions/upload-artifact@v4
        with:
          name: funzug-encrypted-home-credential
          path: ${{ runner.temp }}/funzug-home-envelope.json
          if-no-files-found: error
          retention-days: 1
