name: Reserve approved post for native Meta scheduling
run-name: Native Meta ${{ inputs.action }} ${{ inputs.item_id }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional worker correlation ID, never a credential
        required: false
        type: string
      item_id:
        description: Existing owner-approved post to reserve, not schedule
        required: true
        type: string
      action:
        description: Reserve, checkpoint before UI submission, record a verified planner receipt, or reconcile an observed publication
        required: true
        default: reserve
        type: choice
        options:
          - reserve
          - begin
          - receipt
          - published
          - dashboard
      receipt_json:
        description: Observed planner receipt, only for receipt action, never credentials
        required: false
        type: string
      outcome_json:
        description: Verified Meta publication outcomes, only for published action, never credentials
        required: false
        type: string

concurrency:
  group: funzug-queue-writes
  cancel-in-progress: false

jobs:
  reserve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    permissions:
      contents: write
    steps:
      - name: Check out authoritative queue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate and reserve existing approval
        env:
          ITEM_ID: ${{ inputs.item_id }}
          HANDOFF_ACTION: ${{ inputs.action }}
          NATIVE_RECEIPT_JSON: ${{ inputs.receipt_json }}
          NATIVE_OUTCOME_JSON: ${{ inputs.outcome_json }}
          FUNZUG_DRAFT_INGEST_SECRET: ${{ secrets.FUNZUG_DRAFT_INGEST_SECRET }}
          FUNZUG_BRANDFLOW_DRAFTS_URL: ${{ vars.FUNZUG_BRANDFLOW_DRAFTS_URL }}
        run: python -m scripts.native_meta_handoff --id "$ITEM_ID" --action "$HANDOFF_ACTION"
      - name: Persist reservation before any browser submission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          if [ -f logs/events.jsonl ]; then git add logs/events.jsonl; fi
          if [ -f history.json ]; then git add history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Reserve owner-approved native Meta handoff"
            git push
          fi
      - name: Confirm dashboard guard after authoritative queue commit
        if: inputs.action != 'published'
        env:
          ITEM_ID: ${{ inputs.item_id }}
          FUNZUG_DRAFT_INGEST_SECRET: ${{ secrets.FUNZUG_DRAFT_INGEST_SECRET }}
          FUNZUG_BRANDFLOW_DRAFTS_URL: ${{ vars.FUNZUG_BRANDFLOW_DRAFTS_URL }}
        run: python -m scripts.native_meta_handoff --id "$ITEM_ID" --action dashboard

      - name: Sync verified native publication outcomes to BrandFlow
        if: inputs.action == 'published'
        env:
          FUNZUG_DRAFT_INGEST_SECRET: ${{ secrets.FUNZUG_DRAFT_INGEST_SECRET }}
          FUNZUG_BRANDFLOW_DRAFTS_URL: ${{ vars.FUNZUG_BRANDFLOW_DRAFTS_URL }}
        run: python scripts/brandflow_sync.py sync-results
