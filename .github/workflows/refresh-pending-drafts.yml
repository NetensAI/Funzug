name: Refresh pending Funzug drafts for owner review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funzug-queue-writes
  cancel-in-progress: false

jobs:
  refresh-pending:
    if: github.ref == 'refs/heads/main' && vars.FUNZUG_EXECUTION_OWNER == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: funzug-publish
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up reviewed media validation
        uses: ./.github/actions/setup-media-validator
      - name: Validate private review-only drafts
        run: python funzug_pipeline.py validate-drafts
      - name: Refresh only unapproved pending drafts
        env:
          FUNZUG_DRAFT_INGEST_SECRET: ${{ secrets.FUNZUG_DRAFT_INGEST_SECRET }}
          FUNZUG_BRANDFLOW_DRAFTS_URL: ${{ vars.FUNZUG_BRANDFLOW_DRAFTS_URL }}
        run: python scripts/brandflow_sync.py sync --update-pending
