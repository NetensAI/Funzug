name: Verify Meta credentials (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: vars.FUNZUG_EXECUTION_OWNER == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media image dependency
        run: python -m pip install --requirement media-host/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify access to the configured Meta objects
        env:
          FUNZUG_FACEBOOK_PAGE_ID: ${{ secrets.FUNZUG_FACEBOOK_PAGE_ID }}
          FUNZUG_FACEBOOK_PAGE_TOKEN: ${{ secrets.FUNZUG_FACEBOOK_PAGE_TOKEN }}
          FUNZUG_INSTAGRAM_USER_ID: ${{ secrets.FUNZUG_INSTAGRAM_USER_ID }}
          FUNZUG_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.FUNZUG_INSTAGRAM_ACCESS_TOKEN }}
          FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL: ${{ secrets.FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL }}
          FUNZUG_META_GRAPH_VERSION: ${{ vars.FUNZUG_META_GRAPH_VERSION }}
          FUNZUG_INSTAGRAM_API_MODE: ${{ vars.FUNZUG_INSTAGRAM_API_MODE }}
        run: python -m scripts.verify_meta_credentials
