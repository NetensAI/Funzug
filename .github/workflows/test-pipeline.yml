name: Validate Funzug publishing workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: funzug_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: funzug_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U funzug_test -d funzug_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media image dependency
        run: python -m pip install --requirement media-host/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Test BrandFlow platform outcome contract
        env:
          FUNZUG_TEST_DATABASE_URL: postgres://funzug_test:disposable-ci-only@127.0.0.1:5432/funzug_test
          FUNZUG_REQUIRE_DATABASE_TESTS: "1"
        run: |
          npm ci --prefix brandflow/tests --ignore-scripts --no-audit --no-fund
          npm test --prefix brandflow/tests

      - name: Check media-host Python syntax
        run: python -m py_compile media-host/server.py scripts/upload_media.py scripts/meta_token_diagnostic.py scripts/verify_meta_credentials.py scripts/brandflow_sync.py

      - name: Validate media-host Compose configuration and build
        env:
          FUNZUG_MEDIA_DOMAIN: media.example.com
        run: |
          python -c "from pathlib import Path; d=Path('media-host/secrets'); d.mkdir(parents=True, exist_ok=True); (d/'upload_token').write_text('ci-only-placeholder-token-not-for-deployment'); (d/'tunnel_token').write_text('ci-only-placeholder-tunnel-token')"
          docker compose -f media-host/compose.yaml config --quiet
          docker compose -f media-host/compose.yaml build media

      - name: Validate the publishing queue
        run: python funzug_pipeline.py validate

      - name: Build disabled native Meta worker
        run: docker build -f scheduler/native.Dockerfile -t funzug-native-worker-ci .

      - name: Validate the review-only draft inbox
        run: python funzug_pipeline.py validate-drafts
