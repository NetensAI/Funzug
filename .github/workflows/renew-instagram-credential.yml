name: Renew Instagram Login credential

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Initialize from the separately saved dashboard token
        required: false
        default: false
        type: boolean
      generated_at:
        description: Dashboard token generation time, ISO format with +05:30 IST offset
        required: false
        type: string
      renew_now:
        description: Run a refresh test before switching the publisher
        required: false
        default: false
        type: boolean
      activate_after_refresh:
        description: Switch publisher only after a successful refresh and full credential verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: funzug-instagram-credential-renewal
  cancel-in-progress: false

jobs:
  renew:
    if: github.ref == 'refs/heads/main' && (inputs.bootstrap || inputs.renew_now) && vars.FUNZUG_EXECUTION_OWNER == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: funzug-publish
    steps:
      - name: Allow explicit renewal request
        id: renewal-gate
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.renewal-gate.outputs.run == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.renewal-gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install credential encryption dependencies
        if: steps.renewal-gate.outputs.run == 'true'
        run: python -m pip install "PyJWT[crypto]==2.10.1" "PyNaCl==1.5.0"
      - name: Validate, renew, and save the credential bundle
        if: steps.renewal-gate.outputs.run == 'true'
        env:
          FUNZUG_GH_APP_ID: ${{ secrets.FUNZUG_GH_APP_ID }}
          FUNZUG_GH_APP_PRIVATE_KEY: ${{ secrets.FUNZUG_GH_APP_PRIVATE_KEY }}
          FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL: ${{ secrets.FUNZUG_INSTAGRAM_LOGIN_CREDENTIAL }}
          FUNZUG_INSTAGRAM_LOGIN_CANDIDATE_TOKEN: ${{ secrets.FUNZUG_INSTAGRAM_LOGIN_CANDIDATE_TOKEN }}
          BOOTSTRAP_INSTAGRAM_LOGIN: ${{ inputs.bootstrap }}
          CANDIDATE_GENERATED_AT: ${{ inputs.generated_at }}
          ACTIVATE_AFTER_REFRESH: ${{ inputs.activate_after_refresh }}
          FUNZUG_META_APP_SECRET: ${{ secrets.FUNZUG_META_APP_SECRET }}
          FUNZUG_FACEBOOK_PAGE_TOKEN: ${{ secrets.FUNZUG_FACEBOOK_PAGE_TOKEN }}
          FUNZUG_META_GRAPH_VERSION: ${{ vars.FUNZUG_META_GRAPH_VERSION }}
        run: python -m scripts.renew_instagram_credential
